<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Day 26 - Asynchronous JavaScript and GitHub API"
    >

    <title>DevSpace | GitHub Contributor Lookup</title>

    <link rel="stylesheet" href="style.css">

    <!-- Main Application Engine -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">
            DevSpace
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#github-lookup">Contributors</a>
        </nav>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main id="home">

        <!-- Hero Section -->

        <section class="hero">

            <div class="hero-content">

                <h1>
                    Community Contributor Lookup
                </h1>

                <p>
                    Search for any GitHub developer and
                    view their real-time profile information.
                </p>

            </div>

        </section>


        <!-- =========================
             GITHUB LOOKUP SECTION
        ========================== -->

        <section
            id="github-lookup"
            class="github-section"
        >

            <div class="section-container">

                <h2>
                    Find a GitHub Developer
                </h2>

                <p class="section-description">
                    Enter a GitHub username to fetch their
                    profile using the GitHub REST API.
                </p>


                <!-- Search Box -->

                <div class="github-search">

                    <input
                        type="text"
                        id="github-username"
                        placeholder="Enter GitHub username"
                        autocomplete="off"
                    >

                    <button id="search-dev-btn">
                        Lookup
                    </button>

                </div>


                <!-- Profile Card -->

                <div id="dev-profile-card"></div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            Day 26/50 Web Development Challenge
        </p>

    </footer>

</body>
</html>
