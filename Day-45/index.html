<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Day 45 - Templates & Slots</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==========================================
         NATIVE HTML TEMPLATE
         ========================================== -->

    <template id="modal-template">

        <style>

            /* ======================================
               HIDE MODAL BY DEFAULT
               ====================================== */

            :host {
                display: none;
            }


            /* ======================================
               SHOW MODAL WHEN OPEN ATTRIBUTE EXISTS
               ====================================== */

            :host([open]) {
                display: block;
            }


            /* ======================================
               OVERLAY
               ====================================== */

            .overlay {

                position: fixed;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                background: rgba(0, 0, 0, 0.65);

                display: flex;

                justify-content: center;

                align-items: center;

                z-index: 9999;

            }


            /* ======================================
               MODAL BOX
               ====================================== */

            .modal {

                width: 90%;

                max-width: 500px;

                background: white;

                border-radius: 15px;

                padding: 25px;

                box-shadow:
                    0 15px 40px rgba(0, 0, 0, 0.3);

                animation: popup 0.3s ease;

            }


            /* ======================================
               HEADER
               ====================================== */

            .modal-header {

                border-bottom: 1px solid #ddd;

                padding-bottom: 15px;

                margin-bottom: 20px;

            }


            /* ======================================
               BODY
               ====================================== */

            .modal-body {

                margin-bottom: 25px;

                line-height: 1.6;

            }


            /* ======================================
               STYLE NAMED SLOT
               ====================================== */

            ::slotted(h2) {

                margin: 0;

                color: #dc2626;

                font-size: 26px;

            }


            /* ======================================
               STYLE DEFAULT SLOT
               ====================================== */

            ::slotted(p) {

                margin: 0;

                color: #444;

                font-size: 17px;

            }


            /* ======================================
               CLOSE BUTTON
               ====================================== */

            .close-btn {

                background: #dc2626;

                color: white;

                border: none;

                padding: 11px 22px;

                border-radius: 7px;

                font-size: 15px;

                cursor: pointer;

                transition: 0.3s;

            }


            .close-btn:hover {

                background: #b91c1c;

                transform: translateY(-2px);

            }


            /* ======================================
               POPUP ANIMATION
               ====================================== */

            @keyframes popup {

                from {

                    transform: scale(0.8);

                    opacity: 0;

                }

                to {

                    transform: scale(1);

                    opacity: 1;

                }

            }

        </style>


        <!-- ======================================
             MODAL STRUCTURE
             ====================================== -->

        <div class="overlay">


            <div class="modal">


                <!-- HEADER -->

                <div class="modal-header">

                    <!-- Named Slot -->

                    <slot name="title">

                        Default Title

                    </slot>

                </div>


                <!-- BODY -->

                <div class="modal-body">

                    <!-- Default Slot -->

                    <slot>

                        Default Body

                    </slot>

                </div>


                <!-- CLOSE BUTTON -->

                <button class="close-btn">

                    Close

                </button>


            </div>

        </div>

    </template>


    <!-- ==========================================
         MAIN PAGE
         ========================================== -->

    <main>


        <h1>

            Day 45 - Templates & Slots

        </h1>


        <p class="description">

            Advanced Component Composition using Web Components

        </p>


        <!-- ======================================
             OPEN BUTTONS
             ====================================== -->

        <div class="buttons">


            <button id="openWarning">

                Open Warning Modal

            </button>


            <button id="openSuccess">

                Open Success Modal

            </button>


        </div>


        <!-- ======================================
             WARNING MODAL
             ====================================== -->

        <custom-modal id="warningModal">


            <!-- Content for named slot -->

            <h2 slot="title">

                Warning

            </h2>


            <!-- Content for default slot -->

            <p>

                Are you sure you want to delete this?

            </p>


        </custom-modal>


        <!-- ======================================
             SUCCESS MODAL
             ====================================== -->

        <custom-modal id="successModal">


            <!-- Content for named slot -->

            <h2 slot="title">

                Success

            </h2>


            <!-- Content for default slot -->

            <p>

                Your profile has been successfully updated!

            </p>


        </custom-modal>


    </main>


    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script
        src="./components/CustomModal.js"
        defer>
    </script>


</body>

</html>
