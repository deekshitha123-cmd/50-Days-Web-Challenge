<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Offline Proposal</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <h1>Propose an Initiative</h1>

        <form id="proposalForm">

            <div class="form-group">
                <label for="title">
                    Proposal Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter proposal title"
                    required
                >
            </div>


            <div class="form-group">
                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Enter your proposal..."
                    required
                ></textarea>
            </div>


            <button type="submit">
                Submit Proposal
            </button>

        </form>

    </div>


    <script
        type="module"
        src="./main.js">
    </script>

</body>

</html>
