<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Day 28 - Real-Time GitHub API Search with Debouncing"
    >

    <title>DevSpace | Real-Time GitHub Search</title>

    <link rel="stylesheet" href="style.css">

    <!-- IMPORTANT: Your JavaScript file is app.js -->
    <script src="app.js" defer></script>

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">
            DevSpace
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Developers</a>
            <a href="#">Projects</a>
        </nav>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">

        <section class="hero">

            <h1>
                GitHub Contributor Lookup
            </h1>

            <p>
                Search for any GitHub developer in real-time.
            </p>


            <!-- SEARCH -->

            <div class="search-wrapper">

                <label for="github-username">
                    GitHub Username
                </label>

                <input
                    type="text"
                    id="github-username"
                    placeholder="Try: octocat"
                    autocomplete="off"
                >

                <small>
                    Search automatically after you stop typing.
                </small>

            </div>

        </section>


        <!-- =========================
             STATUS MESSAGE
        ========================== -->

        <div id="status-message"></div>


        <!-- =========================
             PROFILE
        ========================== -->

        <section
            id="dev-profile-card"
            class="profile-container"
        ></section>


        <!-- =========================
             REPOSITORIES
        ========================== -->

        <section
            id="repositories-section"
            class="repositories-section"
        >

            <h2>
                Recent Repositories
            </h2>

            <div
                id="repositories-grid"
                class="repositories-grid"
            ></div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            Day 28/50 Web Development Challenge
        </p>

    </footer>

</body>

</html>
