<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 31 - Infinite Scroll</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <!-- Page Heading -->
    <header class="header">
        <h1>Infinite Scroll Posts</h1>
        <p>Scroll down to load more posts automatically</p>
    </header>


    <!-- Posts will be displayed here -->
    <div id="data-feed"></div>


    <!-- Sentinel -->
    <!-- When this becomes visible, more data will be loaded -->
    <div id="scroll-sentinel" class="loading-spinner">
        Loading more...
    </div>

</body>

</html>
