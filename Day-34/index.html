<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Day 34 - Network Resilience</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #loading {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }

        #error {
            color: red;
            text-align: center;
            margin-bottom: 20px;
        }

        #posts {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );

            gap: 20px;
        }

        .post {
            background: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .post h3 {
            margin-top: 0;
            text-transform: capitalize;
        }

        .post p {
            line-height: 1.5;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛡️ Day 34: Network Resilience</h1>

        <div id="loading"></div>

        <div id="error"></div>

        <div id="posts"></div>

    </div>

    <script
        type="module"
        src="main.js">
    </script>

</body>

</html>
